<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Axiom Engine - 60fps Deterministic Web Viewer</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Consolas', 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 15px; }
    .hud {
      display: inline-block;
      background: #1e293b;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }
    .hud span { font-weight: bold; }
    .blue { color: #38bdf8; }
    .red { color: #f87171; }
    canvas {
      border: 2px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <h1>🏛️ Axiom Engine Web Viewer</h1>
  <div class="sub">100% Deterministic Rust Simulation + Zero-Copy FrameBuffer Rendering</div>
  <div class="hud">
    Tick: <span id="tick">0</span> |
    <span class="blue">Blue Knights:</span> <span id="blue" class="blue">50</span> |
    <span class="red">Red Goblins:</span> <span id="red" class="red">50</span> |
    FPS: <span id="fps">60</span>
  </div>
  <br>
  <canvas id="canvas" width="640" height="480"></canvas>

  <script>
    const width = 640;
    const height = 480;
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const imgData = ctx.createImageData(width, height);
    const buf32 = new Uint32Array(imgData.data.buffer);

    let wasmInstance = null;
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    async function init() {
      try {
        const response = await fetch("axiom_wasm.wasm");
        const bytes = await response.arrayBuffer();
        const { instance } = await WebAssembly.instantiate(bytes, {});
        wasmInstance = instance.exports;

        // Initialize simulation: seed=424242, 640x480 resolution
        wasmInstance.axiom_wasm_init(BigInt(424242), width, height);

        requestAnimationFrame(loop);
      } catch (err) {
        console.error("Failed to load Axiom WASM module:", err);
      }
    }

    function loop(now) {
      if (!wasmInstance) return;

      // 1. Step simulation (60Hz discrete tick)
      wasmInstance.axiom_wasm_step();

      // 2. Render to internal FrameBuffer
      wasmInstance.axiom_wasm_render();

      // 3. Zero-copy copy from WASM memory to Canvas
      const ptr = wasmInstance.axiom_wasm_get_framebuffer_ptr();
      const len = wasmInstance.axiom_wasm_get_framebuffer_len();
      const wasmPixels = new Uint32Array(wasmInstance.memory.buffer, ptr, len);

      // ARGB -> RGBA conversion for HTML5 canvas
      for (let i = 0; i < len; i++) {
        const argb = wasmPixels[i];
        const a = (argb >> 24) & 0xFF;
        const r = (argb >> 16) & 0xFF;
        const g = (argb >> 8) & 0xFF;
        const b = argb & 0xFF;
        buf32[i] = (a << 24) | (b << 16) | (g << 8) | r;
      }
      ctx.putImageData(imgData, 0, 0);

      // 4. Update HUD
      document.getElementById("tick").innerText = wasmInstance.axiom_wasm_get_tick();
      document.getElementById("blue").innerText = wasmInstance.axiom_wasm_get_blue_alive();
      document.getElementById("red").innerText = wasmInstance.axiom_wasm_get_red_alive();

      frameCount++;
      if (now - lastTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = now;
        document.getElementById("fps").innerText = fps;
      }

      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
