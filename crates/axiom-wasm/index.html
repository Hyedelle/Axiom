<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Axiom Engine - 60fps Deterministic Web Viewer</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Consolas', 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 15px; }
    .controls {
      margin-bottom: 12px;
    }
    button {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 4px;
    }
    button.active {
      background: #38bdf8;
      color: #0f172a;
    }
    .action-bar {
      margin-bottom: 10px;
      display: none;
    }
    .action-btn {
      background: #334155;
      color: #facc15;
      border: 1px solid #facc15;
      padding: 6px 12px;
      font-size: 13px;
    }
    .hud {
      display: inline-block;
      background: #1e293b;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }
    .hud span { font-weight: bold; }
    .blue { color: #38bdf8; }
    .red { color: #f87171; }
    .gold { color: #facc15; }
    .green { color: #4ade80; }
    canvas {
      border: 2px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      image-rendering: pixelated;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <h1>🏛️ Axiom Engine Web Viewer</h1>
  <div class="sub">100% Deterministic Rust Simulation + Zero-Copy FrameBuffer Rendering</div>

  <div class="controls">
    <button id="btnArena" class="active" onclick="switchMode('arena')">Phase 1: Auto-Battler</button>
    <button id="btnOpenWorld" onclick="switchMode('openworld')">Phase 3: 100k NPC Streamer</button>
    <button id="btnRpg" onclick="switchMode('rpg')">Phase 4: Open-World RPG</button>
  </div>

  <div id="rpgActionBar" class="action-bar">
    <button class="action-btn" onclick="rpgQuest()">📜 Accept Quest #100</button>
    <button class="action-btn" onclick="rpgEncounter()">⚔️ Trigger Encounter</button>
    <button class="action-btn" onclick="rpgPathfind(10, 10)">🎯 A* Route to (10, 10)</button>
  </div>

  <div class="hud" id="hud">
    Tick: <span id="tick">0</span> |
    <span id="hudDetail"></span> |
    FPS: <span id="fps">60</span>
  </div>
  <br>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="instruction" style="color: #64748b; font-size: 13px; margin-top: 8px;">
    (Phase 1 Mode: 100v100 deterministic auto-battler simulation)
  </div>

  <script>
    const width = 640;
    const height = 480;
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const imgData = ctx.createImageData(width, height);
    const buf32 = new Uint32Array(imgData.data.buffer);

    let wasmInstance = null;
    let mode = 'arena'; // 'arena', 'openworld', or 'rpg'
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;
    let keys = { w: false, a: false, s: false, d: false };

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 's' || e.key === 'ArrowDown') keys.s = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    canvas.addEventListener('click', (e) => {
      if (mode !== 'rpg' || !wasmInstance) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const tileSize = 20;
      const tileX = Math.floor((mouseX - width / 2) / tileSize);
      const tileY = Math.floor((mouseY - height / 2) / tileSize);
      wasmInstance.axiom_rpg_plan_path(tileX, tileY);
    });

    function rpgQuest() {
      if (wasmInstance && mode === 'rpg') {
        wasmInstance.axiom_rpg_interact_quest(1, 100, 999, 1, 500);
      }
    }

    function rpgEncounter() {
      if (wasmInstance && mode === 'rpg') {
        wasmInstance.axiom_rpg_trigger_encounter(999);
      }
    }

    function rpgPathfind(x, y) {
      if (wasmInstance && mode === 'rpg') {
        wasmInstance.axiom_rpg_plan_path(x, y);
      }
    }

    function switchMode(newMode) {
      mode = newMode;
      document.getElementById('btnArena').className = mode === 'arena' ? 'active' : '';
      document.getElementById('btnOpenWorld').className = mode === 'openworld' ? 'active' : '';
      document.getElementById('btnRpg').className = mode === 'rpg' ? 'active' : '';

      const actionBar = document.getElementById('rpgActionBar');
      const instruction = document.getElementById('instruction');

      if (mode === 'arena') {
        actionBar.style.display = 'none';
        instruction.innerText = '(Phase 1 Mode: 100v100 deterministic auto-battler simulation)';
        wasmInstance.axiom_wasm_init(BigInt(424242), width, height);
      } else if (mode === 'openworld') {
        actionBar.style.display = 'none';
        instruction.innerText = '(Phase 3 Mode: Use WASD / Arrow keys to explore infinite procedural chunks & 100k NPCs)';
        wasmInstance.axiom_openworld_init(BigInt(777123), width, height, 100000);
      } else if (mode === 'rpg') {
        actionBar.style.display = 'block';
        instruction.innerText = '(Phase 4 Mode: Click terrain for A* Pathfinding | Use Action buttons for Quests & Combat)';
        wasmInstance.axiom_rpg_init(BigInt(0x12345678), width, height, 100000);
      }
    }

    async function init() {
      try {
        const response = await fetch("axiom_wasm.wasm");
        const bytes = await response.arrayBuffer();
        const { instance } = await WebAssembly.instantiate(bytes, {});
        wasmInstance = instance.exports;

        // Start with Auto-Battler Arena
        switchMode('arena');
        requestAnimationFrame(loop);
      } catch (err) {
        console.error("Failed to load Axiom WASM module:", err);
      }
    }

    function loop(now) {
      if (!wasmInstance) return;

      let ptr, len, tick;

      if (mode === 'arena') {
        wasmInstance.axiom_wasm_step();
        wasmInstance.axiom_wasm_render();
        ptr = wasmInstance.axiom_wasm_get_framebuffer_ptr();
        len = wasmInstance.axiom_wasm_get_framebuffer_len();
        tick = wasmInstance.axiom_wasm_get_tick();

        const blue = wasmInstance.axiom_wasm_get_blue_alive();
        const red = wasmInstance.axiom_wasm_get_red_alive();
        document.getElementById('hudDetail').innerHTML =
          `<span class="blue">Blue Knights:</span> <span class="blue">${blue}</span> | <span class="red">Red Goblins:</span> <span class="red">${red}</span>`;
      } else if (mode === 'openworld') {
        let dx = (keys.d ? 2 : 0) - (keys.a ? 2 : 0);
        let dy = (keys.s ? 2 : 0) - (keys.w ? 2 : 0);

        wasmInstance.axiom_openworld_step(dx, dy);
        wasmInstance.axiom_openworld_render(20);
        ptr = wasmInstance.axiom_openworld_get_framebuffer_ptr();
        len = width * height;
        tick = wasmInstance.axiom_openworld_get_tick();

        const npcs = wasmInstance.axiom_openworld_get_npc_count();
        document.getElementById('hudDetail').innerHTML =
          `<span class="gold">Live NPCs:</span> <span class="gold">${npcs.toLocaleString()}</span> | <span class="blue">Minimap Heatmap:</span> Active`;
      } else if (mode === 'rpg') {
        let dx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
        let dy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);

        wasmInstance.axiom_rpg_step(dx, dy);
        wasmInstance.axiom_rpg_render(20);
        ptr = wasmInstance.axiom_rpg_get_framebuffer_ptr();
        len = width * height;
        tick = wasmInstance.axiom_rpg_get_tick();

        const activeQuests = wasmInstance.axiom_rpg_get_active_quests();
        const doneQuests = wasmInstance.axiom_rpg_get_completed_quests();
        const xp = wasmInstance.axiom_rpg_get_xp();
        const inCombat = wasmInstance.axiom_rpg_is_in_combat();
        const combatDmg = wasmInstance.axiom_rpg_get_combat_damage();

        document.getElementById('hudDetail').innerHTML =
          `<span class="green">Quests (Act/Done):</span> ${activeQuests}/${doneQuests} | ` +
          `<span class="gold">XP:</span> ${xp} | ` +
          `<span class="red">Combat:</span> ${inCombat ? 'ACTIVE' : 'IDLE'} (${combatDmg} Dmg)`;
      }

      // Zero-copy pixel transfer from WASM memory to Canvas
      const wasmPixels = new Uint32Array(wasmInstance.memory.buffer, ptr, len);
      for (let i = 0; i < len; i++) {
        const argb = wasmPixels[i];
        const a = (argb >> 24) & 0xFF;
        const r = (argb >> 16) & 0xFF;
        const g = (argb >> 8) & 0xFF;
        const b = argb & 0xFF;
        buf32[i] = (a << 24) | (b << 16) | (g << 8) | r;
      }
      ctx.putImageData(imgData, 0, 0);

      document.getElementById("tick").innerText = tick;

      frameCount++;
      if (now - lastTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = now;
        document.getElementById("fps").innerText = fps;
      }

      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
