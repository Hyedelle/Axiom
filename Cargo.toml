[workspace]
members = [
    "crates/axiom-core",
    "crates/axiom-render",
    "crates/axiom-cli",
    "crates/axiom-wasm",
    "crates/axiom-game",
    "crates/axiom-net",
    "crates/axiom-sdk",
]
resolver = "2"

[workspace.package]
version = "4.9.0"
edition = "2021"
authors = ["Hyedelle <hyedelle@dreamhub.engine>"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

